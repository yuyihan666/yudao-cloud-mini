plugins {
    id 'java-library'
}

java {
    def javaVersion = JavaVersion.toVersion(libs.versions.java.get())
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.debug = false
    options.compilerArgs << '-parameters'
}

dependencies {
    // BOMs as enforced platform - propagate to api, implementation, compileOnly, compileClasspath
    api(enforcedPlatform(libs.spring.boot.bom))
    api(enforcedPlatform(libs.spring.cloud.bom))
    api(enforcedPlatform(libs.spring.cloud.alibaba.bom))

    // BOMs on annotationProcessor (doesn't extend from api)
    annotationProcessor(enforcedPlatform(libs.spring.boot.bom))
    annotationProcessor(enforcedPlatform(libs.spring.cloud.bom))
    annotationProcessor(enforcedPlatform(libs.spring.cloud.alibaba.bom))

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor libs.lombok.mapstruct.binding
    annotationProcessor libs.mapstruct.processor

    compileOnly 'org.projectlombok:lombok'
    implementation libs.mapstruct

    // JUnit Platform launcher required for test execution
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Force specific versions that differ from the BOM
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
            details.useVersion '3.20.0' // KEEP IN SYNC with libs.versions.toml [versions] commons-lang
        }
    }
}

// ========== Agent-friendly test configuration ==========
tasks.withType(Test).configureEach { testTask ->
    testLogging {
        events = [
                org.gradle.api.tasks.testing.logging.TestLogEvent.PASSED,
                org.gradle.api.tasks.testing.logging.TestLogEvent.SKIPPED,
                org.gradle.api.tasks.testing.logging.TestLogEvent.FAILED
        ] as Set
        showExceptions = true
        showCauses = true
        showStackTraces = true
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
    }

    addTestListener(new org.gradle.api.tasks.testing.TestListener() {
        @Override
        void beforeSuite(org.gradle.api.tasks.testing.TestDescriptor suite) {
        }

        @Override
        void afterSuite(org.gradle.api.tasks.testing.TestDescriptor desc, org.gradle.api.tasks.testing.TestResult result) {
            if (desc.parent != null) {
                return
            }
            logger.lifecycle("Test result: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)")
            logger.lifecycle("HTML report: ${testTask.reports.html.outputLocation.get().asFile}")
            logger.lifecycle("XML results: ${testTask.reports.junitXml.outputLocation.get().asFile}")
        }

        @Override
        void beforeTest(org.gradle.api.tasks.testing.TestDescriptor testDescriptor) {
        }

        @Override
        void afterTest(org.gradle.api.tasks.testing.TestDescriptor testDescriptor, org.gradle.api.tasks.testing.TestResult result) {
        }
    })
}

tasks.register('agentQuick') {
    group = 'verification'
    description = 'AI Agent quick gate: compile and run non-integration tests without Docker.'

    dependsOn tasks.named('test')
}

tasks.named('test', Test).configure {
    useJUnitPlatform {
        excludeTags 'db', 'api', 'integration'
    }
}

tasks.register('agentDb', Test) {
    group = 'verification'
    description = 'AI Agent DB gate: run MySQL Testcontainers tests.'

    useJUnitPlatform {
        includeTags 'db'
        excludeTags 'api'
    }

    shouldRunAfter tasks.named('test')
    mustRunAfter tasks.named('agentQuick')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

tasks.register('agentApi', Test) {
    group = 'verification'
    description = 'AI Agent API gate: run end-to-end API integration tests.'

    useJUnitPlatform {
        includeTags 'api'
    }

    mustRunAfter tasks.named('agentDb')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

tasks.register('agentVerify') {
    group = 'verification'
    description = 'AI Agent final gate: quick tests, DB integration tests, then API integration tests.'

    dependsOn tasks.named('agentQuick')
    dependsOn tasks.named('agentDb')
    dependsOn tasks.named('agentApi')
}
