plugins {
    id 'java-library'
}

java {
    def javaVersion = JavaVersion.toVersion(libs.versions.java.get())
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.debug = false
    options.compilerArgs << '-parameters'
}

dependencies {
    // BOMs as enforced platform - propagate to api, implementation, compileOnly, compileClasspath
    api(enforcedPlatform(libs.spring.boot.bom))
    api(enforcedPlatform(libs.spring.cloud.bom))
    api(enforcedPlatform(libs.spring.cloud.alibaba.bom))

    // BOMs on annotationProcessor (doesn't extend from api)
    annotationProcessor(enforcedPlatform(libs.spring.boot.bom))
    annotationProcessor(enforcedPlatform(libs.spring.cloud.bom))
    annotationProcessor(enforcedPlatform(libs.spring.cloud.alibaba.bom))

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor libs.lombok.mapstruct.binding
    annotationProcessor libs.mapstruct.processor

    compileOnly 'org.projectlombok:lombok'
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok
    implementation libs.mapstruct

    // JUnit Platform launcher required for test execution
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Force specific versions that differ from the BOM
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
            details.useVersion '3.20.0' // KEEP IN SYNC with libs.versions.toml [versions] commons-lang
        }
    }
}

// ========== JSON dependency guardrails ==========
def isDirectFastjsonDependency = { dep ->
    (dep.group == 'com.alibaba' && dep.name == 'fastjson') ||
            (dep.group == 'com.alibaba.fastjson2' && dep.name in ['fastjson2', 'fastjson2-extension'])
}

tasks.register('verifyNoFastjsonUsage') {
    group = 'verification'
    description = 'Fails if first-party source imports Alibaba fastjson APIs.'

    doLast {
        def sourceFiles = fileTree(project.projectDir) {
            include 'src/main/java/**/*.java'
            include 'src/test/java/**/*.java'
            exclude '**/build/**'
        }
        def violations = []
        sourceFiles.files.each { sourceFile ->
            sourceFile.eachLine { line, number ->
                def trimmed = line.trim()
                if (trimmed.startsWith('import com.alibaba.fastjson.') ||
                        trimmed == 'import com.alibaba.fastjson;' ||
                        trimmed.startsWith('import com.alibaba.fastjson2.') ||
                        trimmed == 'import com.alibaba.fastjson2;') {
                    violations << "${project.path}:${project.relativePath(sourceFile)}:${number}: ${trimmed}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Direct fastjson usage is forbidden. Use JsonUtils or ObjectMapper instead:\n" + violations.join('\n'))
        }
    }
}

tasks.register('verifyNoDirectFastjsonDependencies') {
    group = 'verification'
    description = 'Fails if a project directly declares Alibaba fastjson dependencies.'

    doLast {
        def violations = []
        configurations.each { configuration ->
            configuration.dependencies.each { dependency ->
                if (isDirectFastjsonDependency(dependency)) {
                    violations << "${project.path}:${configuration.name}:${dependency.group}:${dependency.name}:${dependency.version ?: '(managed)'}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Direct fastjson dependencies are forbidden:\n" + violations.join('\n'))
        }
    }
}

tasks.register('verifyNoResolvedFastjsonRuntimeDependencies') {
    group = 'verification'
    description = 'Fails if runtime classpaths resolve Alibaba fastjson artifacts.'

    doLast {
        def violations = []
        configurations.matching { configuration ->
            configuration.canBeResolved &&
                    (configuration.name == 'runtimeClasspath' || configuration.name.endsWith('RuntimeClasspath'))
        }.each { configuration ->
            configuration.incoming.resolutionResult.allComponents.each { component ->
                def id = component.id
                if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                        ((id.group == 'com.alibaba' && id.module == 'fastjson') ||
                                (id.group == 'com.alibaba.fastjson2' && id.module in ['fastjson2', 'fastjson2-extension']))) {
                    violations << "${project.path}:${configuration.name}:${id.group}:${id.module}:${id.version}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Resolved fastjson runtime dependencies are forbidden:\n" + violations.join('\n'))
        }
    }
}

tasks.register('agentDependencyAudit') {
    group = 'verification'
    description = 'AI Agent dependency guard: no direct fastjson usage, declarations, or resolved runtime artifacts.'

    dependsOn tasks.named('verifyNoFastjsonUsage')
    dependsOn tasks.named('verifyNoDirectFastjsonDependencies')
    dependsOn tasks.named('verifyNoResolvedFastjsonRuntimeDependencies')
}

def excludeFastjson = { configuration ->
    configuration.exclude group: 'com.alibaba', module: 'fastjson'
    configuration.exclude group: 'com.alibaba.fastjson2', module: 'fastjson2'
    configuration.exclude group: 'com.alibaba.fastjson2', module: 'fastjson2-extension'
}

configurations.matching { it.name.endsWith('RuntimeClasspath') || it.name == 'runtimeClasspath' }.configureEach {
    excludeFastjson(it)
}

// ========== Agent-friendly test configuration ==========
tasks.withType(Test).configureEach { testTask ->
    if (JavaVersion.current().majorVersion.toInteger() >= 25) {
        // Keep agent test logs focused; third-party libraries still use sun.misc.Unsafe on JDK 25.
        jvmArgs '--sun-misc-unsafe-memory-access=allow'
        // Mockito/Byte Buddy appends to the bootstrap classpath, which makes CDS emit noisy test warnings.
        jvmArgs '-Xshare:off'
    }

    testLogging {
        events = [
                org.gradle.api.tasks.testing.logging.TestLogEvent.PASSED,
                org.gradle.api.tasks.testing.logging.TestLogEvent.SKIPPED,
                org.gradle.api.tasks.testing.logging.TestLogEvent.FAILED
        ] as Set
        showExceptions = true
        showCauses = true
        showStackTraces = true
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
    }

    addTestListener(new org.gradle.api.tasks.testing.TestListener() {
        @Override
        void beforeSuite(org.gradle.api.tasks.testing.TestDescriptor suite) {
        }

        @Override
        void afterSuite(org.gradle.api.tasks.testing.TestDescriptor desc, org.gradle.api.tasks.testing.TestResult result) {
            if (desc.parent != null) {
                return
            }
            logger.lifecycle("Test result: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)")
            logger.lifecycle("HTML report: ${testTask.reports.html.outputLocation.get().asFile}")
            logger.lifecycle("XML results: ${testTask.reports.junitXml.outputLocation.get().asFile}")
        }

        @Override
        void beforeTest(org.gradle.api.tasks.testing.TestDescriptor testDescriptor) {
        }

        @Override
        void afterTest(org.gradle.api.tasks.testing.TestDescriptor testDescriptor, org.gradle.api.tasks.testing.TestResult result) {
        }
    })
}

tasks.register('agentQuick') {
    group = 'verification'
    description = 'AI Agent quick gate: compile and run non-integration tests without Docker.'

    dependsOn tasks.named('agentDependencyAudit')
    dependsOn tasks.named('test')
}

tasks.named('test', Test).configure {
    useJUnitPlatform {
        excludeTags 'db', 'api', 'integration'
    }
}

tasks.register('agentDb', Test) {
    group = 'verification'
    description = 'AI Agent DB gate: run MySQL Testcontainers tests.'

    useJUnitPlatform {
        includeTags 'db'
        excludeTags 'api'
    }

    shouldRunAfter tasks.named('test')
    mustRunAfter tasks.named('agentQuick')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

tasks.register('agentApi', Test) {
    group = 'verification'
    description = 'AI Agent API gate: run end-to-end API integration tests.'

    useJUnitPlatform {
        includeTags 'api'
    }

    mustRunAfter tasks.named('agentDb')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

tasks.register('agentVerify') {
    group = 'verification'
    description = 'AI Agent final gate: quick tests, DB integration tests, then API integration tests.'

    dependsOn tasks.named('agentQuick')
    dependsOn tasks.named('agentDb')
    dependsOn tasks.named('agentApi')
}
